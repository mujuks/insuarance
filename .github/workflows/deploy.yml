name: Build verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: royal-shield-react/package-lock.json

      - name: Install dependencies
        working-directory: royal-shield-react
        run: npm ci

      - name: Type-check and build
        working-directory: royal-shield-react
        run: npx tsc -b && npx vite build
